<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>AirShare - 局域网互传</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Join/Create -->
  <div id="home-page" class="page active">
    <div class="home-inner">
      <div class="logo">AirShare</div>
      <p class="subtitle">局域网双向互传</p>
      <div class="name-input">
        <input type="text" id="dev-name" placeholder="设备名称" maxlength="20">
      </div>
      <div class="actions">
        <button id="btn-create" class="btn primary">创建房间</button>
        <button id="btn-join" class="btn secondary">加入房间</button>
      </div>
      <div id="join-box" class="join-form hidden">
        <input type="text" id="room-input" placeholder="输入6位房间号" maxlength="6" autocomplete="off">
        <button id="btn-join-go" class="btn primary">加入</button>
        <button id="btn-join-no" class="btn text">取消</button>
      </div>
    </div>
  </div>

  <!-- Room -->
  <div id="room-page" class="page">
    <div class="header">
      <button id="btn-leave" class="btn text">离开</button>
      <div class="room-info">
        <span class="room-label">房间</span>
        <span id="room-code" class="room-code">------</span>
      </div>
      <div id="qr-area" class="hidden"></div>
    </div>

    <!-- Main content: two-panel on tablet+ -->
    <div class="room-layout">
      <!-- Left panel: Peers -->
      <div class="panel panel-left">
        <div id="peer-section">
          <p class="section-label">已连接设备</p>
          <div id="peer-list">
            <div class="device-empty">等待其他设备...</div>
          </div>
        </div>
        <div id="qr-inline" class="hidden" style="margin-top:12px"></div>
      </div>

      <!-- Right panel: Transfer -->
      <div class="panel panel-right">
        <!-- Send -->
        <div class="transfer-section">
          <p class="section-label">发送文件</p>
          <div class="file-drop-zone" id="drop-zone">
            <div class="drop-icon">+</div>
            <p>点击选择文件</p>
            <input type="file" id="file-input" multiple hidden>
          </div>
          <div id="send-preview" class="file-list"></div>
          <button id="btn-send" class="btn primary" disabled>发送</button>
        </div>

        <!-- Receive -->
        <div class="transfer-section">
          <p class="section-label">接收记录</p>
          <div id="receive-list" class="file-list">
            <div class="empty-hint">暂无</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Progress overlay -->
  <div id="progress-overlay" class="overlay hidden">
    <div class="progress-card">
      <div class="progress-title" id="prog-title">传输中...</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog-bar"></div></div>
      <div class="progress-text" id="prog-pct">0%</div>
      <div class="progress-file" id="prog-file"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
